<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Nam Gaming - Nền tảng chia sẻ game free</title>
  
  <!-- Nhúng Font chữ Cyberpunk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  
  <!-- LỚP NỀN MATRIX (Nằm dưới cùng, không đè giao diện) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- HEADER (main.js sẽ render nội dung vào đây) -->
  <header class="site-header" id="site-header"></header>

  <!-- NỘI DUNG CHÍNH -->
  <main class="site-main">
    <!-- Hero Banner -->
    <section id="hero" class="hero-section"></section>
    
    <!-- Thanh bộ lọc Thể loại -->
    <section id="filters-bar" class="filters-section"></section>
    
    <!-- Layout 2 cột (Bài viết + Sidebar) -->
    <div class="layout-wrapper">
      <div class="main-column">
        <!-- Lưới bài viết (main.js sẽ đổ dữ liệu vào đây) -->
        <div class="posts-grid" id="posts-grid"></div>
        <div class="load-more-wrap" id="load-more-wrap"></div>
      </div>
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar-column"></aside>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- SCRIPTS CỦA BẠN -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  
  <!-- SCRIPT XỬ LÝ NỀN TẢNG (MATRIX & FLAGCOUNTER) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. HIỆU ỨNG MƯA MATRIX
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      let drops = [];
      const fontSize = 16;
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const columns = Math.floor(canvas.width / fontSize);
        drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
      }

      function drawMatrix() {
        ctx.fillStyle = 'rgba(5, 11, 20, 0.1)'; // Nền tối mờ
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f0ff'; // Màu xanh Neon
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          const text = letters.charAt(Math.floor(Math.random() * letters.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      setInterval(drawMatrix, 50);

      // 2. CHÈN FLAG COUNTER VÀO FOOTER (Đợi main.js render xong)
      setTimeout(() => {
        const footer = document.getElementById('site-footer');
        if (footer) {
          footer.insertAdjacentHTML('beforeend', `
            <div class="footer-flagcounter">
              <div class="footer-flagcounter__title">🌍 LƯỢT TRUY CẬP</div>
              <a href="https://info.flagcounter.com/omR5" target="_blank">
                <img src="https://s05.flagcounter.com/count/omR5/bg_FFFFFF/txt_000000/border_CCCCCC/columns_2/maxflags_12/viewers_0/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0" loading="lazy">
              </a>
            </div>
          `);
        }
      }, 1000);
    });
  </script>
</body>
</html>
