<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nam Gaming - Nền tảng chia sẻ game free</title>
  <meta name="description" content="Nam Gaming — tin tức, review, tải game hành động, nhập vai, chiến thuật hot nhất." />
  <meta property="og:title" content="Nam Gaming" />
  <meta property="og:description" content="Nền tảng chia sẻ game free" />
  <meta property="og:type" content="website" />
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Dw7jST9s/2aa9b0ff-4e2b-488c-bb0e-e2fb800cecc8.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- LINK ĐẾN CSS CHÍNH -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  
  <!-- NÚT CÔNG TẮC SÁNG/TỐI -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" id="hero"></section>
    <section class="filters-bar" id="filters-bar"></section>
    <div class="layout">
      <div class="main-col">
        <div class="posts-grid" id="posts-grid"></div>
        <div class="load-more-wrap" id="load-more-wrap"></div>
      </div>
      <aside class="sidebar" id="sidebar"></aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer">
      <!-- Flag Counter sẽ được JS chèn vào đây -->
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  
  <!-- SCRIPT XỬ LÝ THEME & FLAG COUNTER -->
  <script>
    // 1. XỬ LÝ ĐỔI GIAO DIỆN SÁNG/TỐI
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    themeToggleBtn.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');
      let newTheme = theme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    // 2. CHÈN FLAG COUNTER VÀO FOOTER
    setTimeout(() => {
      const footer = document.getElementById('site-footer');
      if (footer) {
        const flagHTML = `
          <div class="footer-flagcounter">
            <div class="footer-flagcounter__title">🌍 LƯỢT TRUY CẬP</div>
            <a href="https://info.flagcounter.com/omR5">
              <img src="https://s05.flagcounter.com/count/omR5/bg_FFFFFF/txt_000000/border_CCCCCC/columns_2/maxflags_12/viewers_0/labels_1/pageviews_1/flags_0/percent_0/" 
                   alt="Flag Counter" border="0" loading="lazy" referrerpolicy="no-referrer">
            </a>
          </div>
        `;
        footer.insertAdjacentHTML('beforeend', flagHTML);
      }
    }, 500);
  </script>

  <!-- ======================================================== -->
  <!-- MÃ BẢO VỆ NỘI DUNG -->
  <!-- ======================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 's' || e.key === 'S' || e.keyCode === 67 || e.keyCode === 83)) { e.preventDefault(); return false; }
      });
      document.addEventListener('dragstart', function(e) {
        if (e.target.nodeName.toUpperCase() === "IMG") { e.preventDefault(); }
      });
    });
  </script>

  <!-- ======================================================== -->
  <!-- BONG BÓNG CHAT AI (GROQ)                                 -->
  <!-- ======================================================== -->
  <button id="ai-chat-toggle" class="ai-chat-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>

  <div id="ai-chat-window" class="ai-chat-window">
    <div class="ai-chat-header">
      <div class="ai-chat-title"><span class="status-dot"></span> Nam Gaming AI</div>
      <button id="ai-chat-close" class="ai-chat-close">&times;</button>
    </div>
    <div id="ai-chat-messages" class="ai-chat-messages">
      <div class="ai-message ai">Chào bạn! Mình là trợ lý ảo của Nam Gaming. Bạn cần tìm game gì hay hỏi gì không? 😎</div>
    </div>
    <div class="ai-chat-input-wrap">
      <input type="text" id="ai-chat-input" placeholder="Hỏi AI..." autocomplete="off">
      <button id="ai-chat-send">Gửi</button>
    </div>
  </div>

  <style>
    /* CSS Chat AI Cyberpunk */
    .ai-chat-toggle { position: fixed; bottom: 30px; right: 90px; width: 60px; height: 60px; background: linear-gradient(135deg, #0055ff, #00f0ff); color: #000; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); transition: transform 0.3s; }
    .ai-chat-toggle:hover { transform: scale(1.1) rotate(10deg); }
    .ai-chat-toggle svg { width: 30px; height: 30px; }
    .ai-chat-window { position: fixed; bottom: 100px; right: 90px; width: 350px; height: 500px; background: rgba(13, 21, 38, 0.95); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 16px; display: flex; flex-direction: column; backdrop-filter: blur(16px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.1); z-index: 9999; transform: scale(0); transform-origin: bottom right; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; pointer-events: none; }
    .ai-chat-window.open { transform: scale(1); opacity: 1; pointer-events: auto; }
    .ai-chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); background: rgba(0, 0, 0, 0.3); border-radius: 16px 16px 0 0; }
    .ai-chat-title { font-family: 'Orbitron', sans-serif; color: #00f0ff; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 1rem; }
    .status-dot { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .ai-chat-close { background: none; border: none; color: #8b9eb7; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
    .ai-chat-close:hover { color: #ff0055; }
    .ai-chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: #00f0ff transparent; }
    .ai-chat-messages::-webkit-scrollbar { width: 6px; }
    .ai-chat-messages::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 10px; }
    .ai-message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .ai-message.ai { background: rgba(0, 240, 255, 0.1); color: #e2e8f0; border-left: 2px solid #00f0ff; align-self: flex-start; border-bottom-left-radius: 2px; }
    .ai-message.user { background: rgba(255, 0, 85, 0.15); color: #fff; border-right: 2px solid #ff0055; align-self: flex-end; border-bottom-right-radius: 2px; }
    .ai-chat-input-wrap { display: flex; padding: 10px; border-top: 1px solid rgba(0, 240, 255, 0.2); background: rgba(0, 0, 0, 0.3); border-radius: 0 0 16px 16px; gap: 10px; }
    #ai-chat-input { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 6px; padding: 10px; color: #fff; font-family: 'Rajdhani', sans-serif; outline: none; }
    #ai-chat-input:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
    #ai-chat-send { background: #00f0ff; color: #000; border: none; border-radius: 6px; padding: 0 15px; font-weight: 700; font-family: 'Rajdhani', sans-serif; cursor: pointer; transition: 0.2s; }
    #ai-chat-send:hover { background: #fff; box-shadow: 0 0 15px #00f0ff; }
    @media (max-width: 480px) { .ai-chat-window { width: calc(100vw - 30px); right: 15px; bottom: 90px; } .ai-chat-toggle { right: 70px; } }
  </style>

  <script>
    const chatToggle = document.getElementById('ai-chat-toggle');
    const chatWindow = document.getElementById('ai-chat-window');
    const chatClose = document.getElementById('ai-chat-close');
    const chatInput = document.getElementById('ai-chat-input');
    const chatSend = document.getElementById('ai-chat-send');
    const chatMessages = document.getElementById('ai-chat-messages');

    // Link mặc định (Sẽ bị ghi đè bởi file huanluyen.json do Admin thiết lập)
    let WORKER_AI_URL = "https://nam-ai-bot.abc.workers.dev"; 
    let chatHistory = [];

    // Hàm tự động tải cấu hình từ Admin (Phòng huấn luyện)
    async function initAIChat() {
      try {
        // ĐỌC FILE HUANLUYEN.JSON
        const res = await fetch("data/huanluyen.json?v=" + Date.now());
        if (res.ok) {
          const config = await res.json();
          
          if (config.worker_url) WORKER_AI_URL = config.worker_url;
          
          const sys = config.system_prompt || "Bạn là trợ lý ảo của Nam Gaming.";
          const kb = config.knowledge_base ? `\n\nDữ liệu của bạn:\n${config.knowledge_base}` : "";
          
          chatHistory.push({ role: "system", content: sys + kb });
        } else {
          chatHistory.push({ role: "system", content: "Bạn là trợ lý ảo của Nam Gaming - web chia sẻ game miễn phí. Hãy trả lời ngắn gọn, thân thiện, xưng 'mình', gọi người dùng là 'bạn'." });
        }
      } catch (e) {
        chatHistory.push({ role: "system", content: "Bạn là trợ lý ảo của Nam Gaming - web chia sẻ game miễn phí. Hãy trả lời ngắn gọn, thân thiện, xưng 'mình', gọi người dùng là 'bạn'." });
      }
    }
    initAIChat(); 

    chatToggle.addEventListener('click', () => chatWindow.classList.add('open'));
    chatClose.addEventListener('click', () => chatWindow.classList.remove('open'));

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `ai-message ${sender}`;
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendToAI() {
      const userText = chatInput.value.trim();
      if (!userText) return;

      addMessage(userText, 'user');
      chatInput.value = '';
      chatHistory.push({ role: "user", content: userText });

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'ai-message ai';
      loadingDiv.textContent = '...';
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch(WORKER_AI_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory })
        });

        const data = await response.json();
        chatMessages.removeChild(loadingDiv);

        if (data.choices && data.choices.length > 0) {
          const aiReply = data.choices[0].message.content;
          addMessage(aiReply, 'ai');
          chatHistory.push({ role: "assistant", content: aiReply });
        } else {
          addMessage("Xin lỗi, mình đang gặp lỗi. Thử lại sau nhé!", 'ai');
        }
      } catch (error) {
        console.error(error);
        chatMessages.removeChild(loadingDiv);
        addMessage("Lỗi kết nối máy chủ AI.", 'ai');
      }
    }

    chatSend.addEventListener('click', sendToAI);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendToAI(); });
  </script>
</body>
</html>
