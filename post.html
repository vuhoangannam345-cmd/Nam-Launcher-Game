<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang tải… — Nam Gaming</title>
  <meta name="description" content="Chi tiết bài viết trên Nam Gaming" />
  <meta property="og:title" id="og-title" content="Nam Gaming" />
  <meta property="og:description" id="og-desc" content="" />
  <meta property="og:image" id="og-image" content="" />
  <meta property="og:type" content="article" />
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Dw7jST9s/2aa9b0ff-4e2b-488c-bb0e-e2fb800cecc8.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- CSS DÀNH RIÊNG CHO KHUNG BÌNH LUẬN CYBERPUNK -->
  <style>
    .cyber-comment-section {
      max-width: 900px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: rgba(13, 21, 38, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    /* Viền phát sáng trên cùng của khung bình luận */
    .cyber-comment-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, #00f0ff, #ff0055);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }

    .cyber-comment-title {
      font-family: 'Orbitron', sans-serif;
      color: #00f0ff;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px dashed rgba(0, 240, 255, 0.2);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      display: flex; align-items: center; gap: 10px;
    }

    .cyber-input, .cyber-textarea {
      width: 100%;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px;
      color: #e2e8f0;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      margin-bottom: 1rem;
    }
    .cyber-input:focus, .cyber-textarea:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.05);
    }

    .cyber-btn {
      background: linear-gradient(135deg, #0055ff, #00f0ff);
      color: #000;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .cyber-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); }
    .cyber-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .cyber-comment-item {
      background: rgba(0, 0, 0, 0.2);
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border-radius: 8px;
      border-left: 3px solid #00f0ff;
      transition: 0.2s;
    }
    .cyber-comment-item:hover { background: rgba(0, 0, 0, 0.3); }
    .cyber-comment-item strong { color: #00f0ff; font-size: 1.05rem; font-family: 'Orbitron', sans-serif; }
    .cyber-comment-item p { color: #e2e8f0; margin: 8px 0; font-size: 1rem; line-height: 1.5; }
    
    .cyber-reply-btn {
      background: none; border: none; color: #8b9eb7; cursor: pointer; 
      font-size: 0.85rem; text-decoration: underline; transition: 0.2s; padding: 0;
      font-family: 'Chakra Petch', sans-serif; font-weight: 600;
    }
    .cyber-reply-btn:hover { color: #ff0055; }

    .cyber-reply-box {
      margin-left: 2rem; margin-top: 10px; padding: 12px 15px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 2px solid #ff0055;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>
<body data-page="post">
  
  <!-- NÚT CÔNG TẮC SÁNG/TỐI -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>

  <header class="site-header" id="site-header"></header>

  <main>
    <!-- PHẦN CHI TIẾT BÀI VIẾT -->
    <article class="post-detail" id="post-detail"></article>

    <!-- ========================================== -->
    <!-- KHUNG BÌNH LUẬN CYBERPUNK 2026             -->
    <!-- ========================================== -->
    <div class="cyber-comment-section">
      <h3 class="cyber-comment-title">💬 Khu Vực Bình Luận</h3>
      
      <!-- Form gửi -->
      <div style="margin-bottom: 2.5rem;">
        <input type="text" id="c-name" class="cyber-input" placeholder="Nhập tên hiển thị của bạn...">
        <textarea id="c-content" class="cyber-textarea" rows="3" placeholder="Để lại bình luận hoặc đánh giá về game..."></textarea>
        <div style="display: flex; align-items: center; gap: 15px;">
          <button id="btn-send-comment" class="cyber-btn">Gửi Bình Luận</button>
          <span id="comment-status" style="color: #00f0ff; font-weight: 600; font-family: 'Chakra Petch';"></span>
        </div>
      </div>

      <!-- Hiển thị bình luận -->
      <div id="comments-list">
        <p style="color: #8b9eb7; font-style: italic;">[ Đang tải dữ liệu bình luận... ]</p>
      </div>
    </div>
    <!-- ========================================== -->

    <!-- BÀI VIẾT LIÊN QUAN & SIDEBAR -->
    <div class="layout">
      <div class="main-col">
        <section class="related" id="related-posts"></section>
      </div>
      <aside class="sidebar" id="sidebar"></aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>

  <!-- SCRIPT XỬ LÝ THEME -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    themeToggleBtn.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');
      let newTheme = theme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });
  </script>

  <!-- SCRIPT XỬ LÝ BÌNH LUẬN -->
  <script>
    // >>> DÁN LINK WEBHOOK DISCORD CỦA BẠN VÀO ĐÂY <<<
    const DISCORD_COMMENT_WEBHOOK = "https://discord.com/api/webhooks/1544988695613014107/c5or1vqGvxhFVWLWkmGG6ak2HDbmHhejdhiz2t-RqkqpKc3hOCM6Jpcy7PBuuZxd1Wta";
    
    const urlParams = new URLSearchParams(window.location.search);
    const currentPostId = urlParams.get('id') || "unknown-post";

    // 1. Tải bình luận từ file JSON
    async function loadComments() {
      try {
        const res = await fetch("data/comments.json?v=" + Date.now());
        const comments = await res.json();
        const postComments = comments.filter(c => c.postId === currentPostId);
        const list = document.getElementById("comments-list");

        if (postComments.length === 0) {
          list.innerHTML = "<p style='color: #8b9eb7;'>Chưa có bình luận nào. Hãy là người đầu tiên trải nghiệm!</p>";
          return;
        }

        const rootComments = postComments.filter(c => !c.parentId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        list.innerHTML = rootComments.map(cmt => {
          const replies = postComments.filter(r => r.parentId === cmt.id).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
          
          const replyHtml = replies.map(r => `
            <div class="cyber-reply-box">
              <strong style="color: #ff0055; font-family: 'Orbitron';">${r.name}</strong>
              <p style="margin: 5px 0; font-size: 0.95rem;">${r.content}</p>
            </div>
          `).join("");

          return `
            <div class="cyber-comment-item">
              <strong>${cmt.name}</strong>
              <p>${cmt.content}</p>
              <button class="cyber-reply-btn" onclick="toggleReply('${cmt.id}')">↩ Trả lời</button>
              
              <!-- Form ẩn để trả lời -->
              <div id="reply-area-${cmt.id}" style="display:none; margin-top: 15px;">
                <input type="text" id="reply-name-${cmt.id}" class="cyber-input" placeholder="Tên của bạn..." style="padding: 8px; font-size: 0.9rem;">
                <textarea id="reply-content-${cmt.id}" class="cyber-textarea" placeholder="Viết câu trả lời..." rows="2" style="padding: 8px; font-size: 0.9rem;"></textarea>
                <button onclick="submitReply('${cmt.id}')" class="cyber-btn" style="padding: 5px 15px; font-size: 0.85rem;">Gửi trả lời</button>
              </div>
              
              ${replyHtml ? `<div style="margin-top: 15px;">${replyHtml}</div>` : ''}
            </div>
          `;
        }).join("");
      } catch (e) {
        console.error(e);
        document.getElementById("comments-list").innerHTML = "<p style='color: #ff0055;'>Lỗi kết nối dữ liệu bình luận. Vui lòng tạo file data/comments.json</p>";
      }
    }

    // 2. Hàm gửi lên Discord
    async function sendToDiscord(name, content, parentId = null) {
      const status = document.getElementById("comment-status");
      status.textContent = "⏳ Đang gửi...";

      const payload = {
        username: "Nam Gaming Comment Bot",
        embeds: [{
          title: parentId ? "↩️ CÓ TRẢ LỜI MỚI" : "💬 CÓ BÌNH LUẬN MỚI",
          color: parentId ? 16711680 : 3447003, 
          fields: [
            { name: "Bài viết ID", value: currentPostId, inline: true },
            { name: "Người gửi", value: name, inline: true },
            { name: "Nội dung", value: content, inline: false }
          ],
          footer: { text: "Copy ID & nội dung để duyệt vào comments.json" }
        }]
      };

      try {
        const res = await fetch(DISCORD_COMMENT_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          status.textContent = "✅ Đã gửi! Vui lòng đợi Admin duyệt.";
          setTimeout(() => status.textContent = "", 5000);
          return true;
        }
      } catch (e) { console.error(e); }
      
      status.textContent = "❌ Gửi thất bại.";
      return false;
    }

    // Sự kiện gửi bình luận gốc
    document.getElementById("btn-send-comment").addEventListener("click", async () => {
      const btn = document.getElementById("btn-send-comment");
      const name = document.getElementById("c-name").value.trim();
      const content = document.getElementById("c-content").value.trim();
      
      if (!name || !content) return alert("Vui lòng nhập đủ tên và nội dung!");

      btn.disabled = true;
      btn.textContent = "ĐANG GỬI...";
      
      const success = await sendToDiscord(name, content);
      
      btn.disabled = false;
      btn.textContent = "Gửi Bình Luận";
      
      if (success) document.getElementById("c-content").value = "";
    });

    // Hàm ẩn/hiện form trả lời
    window.toggleReply = function(id) {
      const area = document.getElementById(`reply-area-${id}`);
      area.style.display = area.style.display === "none" ? "block" : "none";
    }

    // Hàm gửi trả lời
    window.submitReply = async function(parentId) {
      const name = document.getElementById(`reply-name-${parentId}`).value.trim();
      const content = document.getElementById(`reply-content-${parentId}`).value.trim();
      if (!name || !content) return alert("Vui lòng nhập đủ thông tin!");

      const success = await sendToDiscord(name, content, parentId);
      if (success) {
        document.getElementById(`reply-area-${parentId}`).style.display = "none";
        document.getElementById(`reply-name-${parentId}`).value = "";
        document.getElementById(`reply-content-${parentId}`).value = "";
      }
    }

    // Khởi chạy load bình luận
    loadComments();
  </script>

  <!-- ======================================================== -->
  <!-- MÃ BẢO VỆ NỘI DUNG (CHỐNG CHUỘT PHẢI, F12, COPY) -->
  <!-- ======================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Chặn chuột phải (Menu ngữ cảnh)
      document.addEventListener('contextmenu', event => event.preventDefault());

      // 2. Chặn các phím tắt phổ biến (F12, Ctrl+Shift+I, Ctrl+U, Ctrl+C, Ctrl+S)
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 's' || e.key === 'S' || e.keyCode === 67 || e.keyCode === 83)) { e.preventDefault(); return false; }
      });

      // 3. Chặn kéo thả ảnh (Drag & Drop)
      document.addEventListener('dragstart', function(e) {
        if (e.target.nodeName.toUpperCase() === "IMG") { e.preventDefault(); }
      });
    });
  </script>
</body>
</html>
