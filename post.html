<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đang tải… — Nam Gaming</title>
  <meta name="description" content="Chi tiết bài viết trên Nam Gaming" />
  <meta property="og:title" id="og-title" content="Nam Gaming" />
  <meta property="og:description" id="og-desc" content="" />
  <meta property="og:image" id="og-image" content="" />
  <meta property="og:type" content="article" />
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Dw7jST9s/2aa9b0ff-4e2b-488c-bb0e-e2fb800cecc8.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- LINK ĐẾN CSS CHÍNH -->
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- CSS DÀNH RIÊNG CHO KHUNG BÌNH LUẬN CYBERPUNK -->
  <style>
    body { background-color: #050914 !important; color: #e2e8f0 !important; font-family: "Rajdhani", sans-serif; margin: 0; }
    
    .cyber-comment-section {
      max-width: 900px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: rgba(13, 21, 38, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.05);
      position: relative;
      overflow: hidden;
    }
    .cyber-comment-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, #00f0ff, #ff0055);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }
    .cyber-comment-title {
      font-family: 'Orbitron', sans-serif;
      color: #00f0ff;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px dashed rgba(0, 240, 255, 0.2);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      display: flex; align-items: center; gap: 10px;
    }
    .cyber-input, .cyber-textarea {
      width: 100%; padding: 1rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 8px; color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif; font-size: 1rem; outline: none; transition: 0.3s;
      margin-bottom: 1rem; box-sizing: border-box;
    }
    .cyber-input:focus, .cyber-textarea:focus {
      border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); background: rgba(0, 240, 255, 0.05);
    }
    .cyber-btn {
      background: linear-gradient(135deg, #0055ff, #00f0ff); color: #000;
      padding: 0.8rem 2rem; border: none; border-radius: 4px;
      font-family: 'Rajdhani', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer; transition: 0.3s;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .cyber-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); }
    .cyber-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .cyber-comment-item {
      background: rgba(0, 0, 0, 0.2); padding: 1.2rem; margin-bottom: 1.2rem;
      border-radius: 8px; border-left: 3px solid #00f0ff; transition: 0.2s;
    }
    .cyber-comment-item:hover { background: rgba(0, 0, 0, 0.3); }
    .cyber-comment-item strong { color: #00f0ff; font-size: 1.05rem; font-family: 'Orbitron', sans-serif; }
    .cyber-comment-item p { color: #e2e8f0; margin: 8px 0; font-size: 1rem; line-height: 1.5; }
    
    .cyber-reply-btn { background: none; border: none; color: #8b9eb7; cursor: pointer; font-size: 0.85rem; text-decoration: underline; transition: 0.2s; padding: 0; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
    .cyber-reply-btn:hover { color: #ff0055; }
    .cyber-reply-box { margin-left: 2rem; margin-top: 10px; padding: 12px 15px; background: rgba(255, 255, 255, 0.03); border-left: 2px solid #ff0055; border-radius: 0 6px 6px 0; }
  </style>
</head>
<body data-page="post">
  
  <!-- NÚT CÔNG TẮC SÁNG/TỐI -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>

  <header class="site-header" id="site-header"></header>

  <main>
    <!-- PHẦN CHI TIẾT BÀI VIẾT (main.js render) -->
    <article class="post-detail" id="post-detail"></article>

    <!-- KHUNG BÌNH LUẬN CYBERPUNK 2026 -->
    <div class="cyber-comment-section">
      <h3 class="cyber-comment-title">💬 Khu Vực Bình Luận</h3>
      
      <!-- Form gửi bình luận -->
      <div style="margin-bottom: 2.5rem;">
        <input type="text" id="c-name" class="cyber-input" placeholder="Nhập tên hiển thị của bạn...">
        <textarea id="c-content" class="cyber-textarea" rows="3" placeholder="Để lại bình luận hoặc đánh giá về game..."></textarea>
        <div style="display: flex; align-items: center; gap: 15px;">
          <button id="btn-send-comment" class="cyber-btn">Gửi Bình Luận</button>
          <span id="comment-status" style="color: #00f0ff; font-weight: 600; font-family: 'Rajdhani';"></span>
        </div>
      </div>

      <!-- Nơi hiển thị danh sách bình luận -->
      <div id="comments-list">
        <p style="color: #8b9eb7; font-style: italic;">[ Đang tải dữ liệu bình luận... ]</p>
      </div>
    </div>

    <!-- BÀI VIẾT LIÊN QUAN & SIDEBAR -->
    <div class="layout">
      <div class="main-col">
        <section class="related" id="related-posts"></section>
      </div>
      <aside class="sidebar" id="sidebar"></aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- ======================================================== -->
  <!-- BONG BÓNG CHAT AI (GROQ)                                 -->
  <!-- ======================================================== -->
  <button id="ai-chat-toggle" class="ai-chat-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>

  <div id="ai-chat-window" class="ai-chat-window">
    <div class="ai-chat-header">
      <div class="ai-chat-title"><span class="status-dot"></span> Nam Gaming AI</div>
      <button id="ai-chat-close" class="ai-chat-close">&times;</button>
    </div>
    <div id="ai-chat-messages" class="ai-chat-messages">
      <div class="ai-message ai">Chào bạn! Mình là trợ lý ảo của Nam Gaming. Bạn cần tìm game gì hay hỏi gì không? 😎</div>
    </div>
    <div class="ai-chat-input-wrap">
      <input type="text" id="ai-chat-input" placeholder="Hỏi AI..." autocomplete="off">
      <button id="ai-chat-send">Gửi</button>
    </div>
  </div>

  <style>
    /* CSS Chat AI Cyberpunk */
    .ai-chat-toggle { position: fixed; bottom: 30px; right: 90px; width: 60px; height: 60px; background: linear-gradient(135deg, #0055ff, #00f0ff); color: #000; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); transition: transform 0.3s; }
    .ai-chat-toggle:hover { transform: scale(1.1) rotate(10deg); }
    .ai-chat-toggle svg { width: 30px; height: 30px; }
    .ai-chat-window { position: fixed; bottom: 100px; right: 90px; width: 350px; height: 500px; background: rgba(13, 21, 38, 0.95); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 16px; display: flex; flex-direction: column; backdrop-filter: blur(16px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.1); z-index: 9999; transform: scale(0); transform-origin: bottom right; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; pointer-events: none; }
    .ai-chat-window.open { transform: scale(1); opacity: 1; pointer-events: auto; }
    .ai-chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); background: rgba(0, 0, 0, 0.3); border-radius: 16px 16px 0 0; }
    .ai-chat-title { font-family: 'Orbitron', sans-serif; color: #00f0ff; font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 1rem; }
    .status-dot { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .ai-chat-close { background: none; border: none; color: #8b9eb7; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
    .ai-chat-close:hover { color: #ff0055; }
    .ai-chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: #00f0ff transparent; }
    .ai-chat-messages::-webkit-scrollbar { width: 6px; }
    .ai-chat-messages::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 10px; }
    .ai-message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; line-height: 1.4; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .ai-message.ai { background: rgba(0, 240, 255, 0.1); color: #e2e8f0; border-left: 2px solid #00f0ff; align-self: flex-start; border-bottom-left-radius: 2px; }
    .ai-message.user { background: rgba(255, 0, 85, 0.15); color: #fff; border-right: 2px solid #ff0055; align-self: flex-end; border-bottom-right-radius: 2px; }
    .ai-chat-input-wrap { display: flex; padding: 10px; border-top: 1px solid rgba(0, 240, 255, 0.2); background: rgba(0, 0, 0, 0.3); border-radius: 0 0 16px 16px; gap: 10px; }
    #ai-chat-input { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 6px; padding: 10px; color: #fff; font-family: 'Rajdhani', sans-serif; outline: none; }
    #ai-chat-input:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
    #ai-chat-send { background: #00f0ff; color: #000; border: none; border-radius: 6px; padding: 0 15px; font-weight: 700; font-family: 'Rajdhani', sans-serif; cursor: pointer; transition: 0.2s; }
    #ai-chat-send:hover { background: #fff; box-shadow: 0 0 15px #00f0ff; }
    @media (max-width: 480px) { .ai-chat-window { width: calc(100vw - 30px); right: 15px; bottom: 90px; } .ai-chat-toggle { right: 70px; } }
  </style>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>

  <!-- SCRIPT XỬ LÝ THEME -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    if (themeToggleBtn) themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        let theme = document.documentElement.getAttribute('data-theme');
        let newTheme = theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });
    }
  </script>

  <!-- SCRIPT XỬ LÝ BÌNH LUẬN QUA CLOUDFLARE WORKER -->
  <script>
    // Đường link Cloudflare Worker của bạn
    const WORKER_URL = "https://nam-bot1.vuhoangannam345.workers.dev"; 
    
    const currentPostId = new URLSearchParams(window.location.search).get('id') || "unknown-post";

    // 1. Hàm tải bình luận
    async function loadComments() {
      try {
        const res = await fetch("data/comments.json?v=" + Date.now());
        if(!res.ok) throw new Error("Chưa có file comments.json");
        
        const comments = await res.json();
        const postComments = comments.filter(c => c.postId === currentPostId);
        const list = document.getElementById("comments-list");

        if (postComments.length === 0) {
          list.innerHTML = "<p style='color: #8b9eb7;'>Chưa có bình luận nào. Hãy là người đầu tiên trải nghiệm!</p>";
          return;
        }

        const rootComments = postComments.filter(c => !c.parentId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        list.innerHTML = rootComments.map(cmt => {
          const replies = postComments.filter(r => r.parentId === cmt.id).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
          
          const replyHtml = replies.map(r => `
            <div class="cyber-reply-box">
              <strong style="color: #ff0055; font-family: 'Orbitron';">${r.name}</strong>
              <p style="margin: 5px 0; font-size: 0.95rem;">${r.content}</p>
            </div>
          `).join("");

          return `
            <div class="cyber-comment-item">
              <strong>${cmt.name}</strong>
              <p>${cmt.content}</p>
              <button class="cyber-reply-btn" onclick="toggleReply('${cmt.id}')">↩ Trả lời</button>
              
              <div id="reply-area-${cmt.id}" style="display:none; margin-top: 15px;">
                <input type="text" id="reply-name-${cmt.id}" class="cyber-input" placeholder="Tên của bạn..." style="padding: 8px; font-size: 0.9rem;">
                <textarea id="reply-content-${cmt.id}" class="cyber-textarea" placeholder="Viết câu trả lời..." rows="2" style="padding: 8px; font-size: 0.9rem;"></textarea>
                <button onclick="submitReply('${cmt.id}')" class="cyber-btn" style="padding: 5px 15px; font-size: 0.85rem;">Gửi trả lời</button>
              </div>
              
              ${replyHtml ? `<div style="margin-top: 15px;">${replyHtml}</div>` : ''}
            </div>
          `;
        }).join("");
      } catch (e) {
        console.error(e);
        document.getElementById("comments-list").innerHTML = "<p style='color: #ff0055;'>Lỗi kết nối dữ liệu bình luận.</p>";
      }
    }

    // 2. Hàm gửi bình luận
    async function sendCommentToServer(name, content, parentId = null) {
      const status = document.getElementById("comment-status");
      status.textContent = "⏳ Đang gửi...";

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postId: currentPostId, name: name, content: content, parentId: parentId })
        });
        
        if (res.ok) {
          status.textContent = "✅ Đã đăng bình luận!";
          setTimeout(() => status.textContent = "", 3000);
          setTimeout(() => loadComments(), 1000); 
          return true;
        } else {
          status.textContent = "❌ Gửi thất bại.";
          return false;
        }
      } catch (e) {
        console.error(e);
        status.textContent = "❌ Lỗi mạng.";
        return false;
      }
    }

    document.getElementById("btn-send-comment").addEventListener("click", async () => {
      const btn = document.getElementById("btn-send-comment");
      const name = document.getElementById("c-name").value.trim();
      const content = document.getElementById("c-content").value.trim();
      
      if (!name || !content) return alert("Vui lòng nhập đủ tên và nội dung!");

      btn.disabled = true;
      btn.textContent = "ĐANG GỬI...";
      
      const success = await sendCommentToServer(name, content);
      
      btn.disabled = false;
      btn.textContent = "Gửi Bình Luận";
      
      if (success) document.getElementById("c-content").value = "";
    });

    window.toggleReply = function(id) {
      const area = document.getElementById(`reply-area-${id}`);
      area.style.display = area.style.display === "none" ? "block" : "none";
    }

    window.submitReply = async function(parentId) {
      const name = document.getElementById(`reply-name-${parentId}`).value.trim();
      const content = document.getElementById(`reply-content-${parentId}`).value.trim();
      if (!name || !content) return alert("Vui lòng nhập đủ thông tin!");

      const success = await sendCommentToServer(name, content, parentId);
      if (success) {
        document.getElementById(`reply-area-${parentId}`).style.display = "none";
        document.getElementById(`reply-name-${parentId}`).value = "";
        document.getElementById(`reply-content-${parentId}`).value = "";
      }
    }

    loadComments();
  </script>

  <!-- SCRIPT XỬ LÝ CHAT AI -->
  <script>
    const chatToggle = document.getElementById('ai-chat-toggle');
    const chatWindow = document.getElementById('ai-chat-window');
    const chatClose = document.getElementById('ai-chat-close');
    const chatInput = document.getElementById('ai-chat-input');
    const chatSend = document.getElementById('ai-chat-send');
    const chatMessages = document.getElementById('ai-chat-messages');

    let WORKER_AI_URL = "https://nam-ai-bot.abc.workers.dev"; 
    let chatHistory = [];

    async function initAIChat() {
      try {
        const res = await fetch("data/huanluyen.json?v=" + Date.now());
        if (res.ok) {
          const config = await res.json();
          if (config.worker_url) WORKER_AI_URL = config.worker_url;
          const sys = config.system_prompt || "Bạn là trợ lý ảo của Nam Gaming.";
          const kb = config.knowledge_base ? `\n\nDữ liệu của bạn:\n${config.knowledge_base}` : "";
          chatHistory.push({ role: "system", content: sys + kb });
        } else {
          chatHistory.push({ role: "system", content: "Bạn là trợ lý ảo của Nam Gaming - web chia sẻ game miễn phí. Hãy trả lời ngắn gọn, thân thiện, xưng 'mình', gọi người dùng là 'bạn'." });
        }
      } catch (e) {
        chatHistory.push({ role: "system", content: "Bạn là trợ lý ảo của Nam Gaming - web chia sẻ game miễn phí. Hãy trả lời ngắn gọn, thân thiện, xưng 'mình', gọi người dùng là 'bạn'." });
      }
    }
    initAIChat(); 

    chatToggle.addEventListener('click', () => chatWindow.classList.add('open'));
    chatClose.addEventListener('click', () => chatWindow.classList.remove('open'));

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `ai-message ${sender}`;
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendToAI() {
      const userText = chatInput.value.trim();
      if (!userText) return;

      addMessage(userText, 'user');
      chatInput.value = '';
      chatHistory.push({ role: "user", content: userText });

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'ai-message ai';
      loadingDiv.textContent = '...';
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch(WORKER_AI_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: chatHistory })
        });

        const data = await response.json();
        chatMessages.removeChild(loadingDiv);

        if (data.choices && data.choices.length > 0) {
          const aiReply = data.choices[0].message.content;
          addMessage(aiReply, 'ai');
          chatHistory.push({ role: "assistant", content: aiReply });
        } else {
          addMessage("Xin lỗi, mình đang gặp lỗi. Thử lại sau nhé!", 'ai');
        }
      } catch (error) {
        console.error(error);
        chatMessages.removeChild(loadingDiv);
        addMessage("Lỗi kết nối máy chủ AI.", 'ai');
      }
    }

    chatSend.addEventListener('click', sendToAI);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendToAI(); });
  </script>

  <!-- MÃ BẢO VỆ NỘI DUNG (CHỐNG CHUỘT PHẢI, F12, COPY) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 's' || e.key === 'S' || e.keyCode === 67 || e.keyCode === 83)) { e.preventDefault(); return false; }
      });
      document.addEventListener('dragstart', function(e) {
        if (e.target.nodeName.toUpperCase() === "IMG") { e.preventDefault(); }
      });
    });
  </script>
</body>
</html>
