<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Đang tải… — Nam Gaming</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="post">
  
  <canvas id="matrix-canvas"></canvas>
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>

  <header class="site-header" id="site-header"></header>

  <main class="site-main">
    <!-- Thẻ rỗng, main.js sẽ render nội dung vào -->
    <article class="post-detail-wrapper" id="post-detail"></article>

    <div class="layout-wrapper">
      <div class="main-column">
        <section class="related-section" id="related-posts"></section>
      </div>
      <aside class="sidebar-column" id="sidebar"></aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    // Copy y hệt đoạn script Matrix, Theme, Flag Counter ở trên vào đây
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      let drops = [];
      const fontSize = 16;
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const columns = Math.floor(canvas.width / fontSize);
        drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
      }
      function drawMatrix() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        ctx.fillStyle = isDark ? 'rgba(5, 11, 20, 0.1)' : 'rgba(240, 244, 248, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = isDark ? '#00f0ff' : '#0284c7';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          const text = letters.charAt(Math.floor(Math.random() * letters.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      setInterval(drawMatrix, 50);

      const themeToggleBtn = document.getElementById('theme-toggle');
      const currentTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      themeToggleBtn.addEventListener('click', () => {
        let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });

      setTimeout(() => {
        const footer = document.getElementById('site-footer');
        if (footer) {
          footer.insertAdjacentHTML('beforeend', `
            <div class="footer-flagcounter">
              <div class="footer-flagcounter__title">🌍 LƯỢT TRUY CẬP</div>
              <a href="https://info.flagcounter.com/omR5" target="_blank">
                <img src="https://s05.flagcounter.com/count/omR5/bg_FFFFFF/txt_000000/border_CCCCCC/columns_2/maxflags_12/viewers_0/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0" loading="lazy">
              </a>
            </div>
          `);
        }
      }, 1000);
    });
  </script>
</body>
</html>
