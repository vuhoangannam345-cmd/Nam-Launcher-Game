<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giải Đấu - Nam Gaming</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Dw7jST9s/2aa9b0ff-4e2b-488c-bb0e-e2fb800cecc8.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="tournaments">
  
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
      <h1 style="font-family: 'Orbitron', sans-serif; color: var(--primary); text-align: center; margin-bottom: 1rem; text-shadow: var(--glow); font-size: clamp(2rem, 5vw, 3rem);">
        🏆 ĐẤU TRƯỜNG NAM GAMING
      </h1>
      <p style="text-align: center; color: var(--text-dim); margin-bottom: 3rem; font-size: 1.1rem;">
        Nơi anh em gamer thể hiện bản lĩnh và rinh về những phần thưởng hấp dẫn!
      </p>
      
      <!-- LƯỚI GIẢI ĐẤU -->
      <div class="posts-grid" id="tournaments-grid">
        <p style="text-align: center; grid-column: 1/-1; color: var(--text-dim); font-style: italic;">[ Đang tải... ]</p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    if (themeToggleBtn) themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });
    }
  </script>
</body>
</html>
