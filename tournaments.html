<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết Giải Đấu - Nam Gaming</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Dw7jST9s/2aa9b0ff-4e2b-488c-bb0e-e2fb800cecc8.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="tournament">
  
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>
  <header class="site-header" id="site-header"></header>

  <main>
    <!-- NƠI HIỂN THỊ CHI TIẾT GIẢI ĐẤU -->
    <article class="post-detail" id="tournament-detail" style="max-width: 900px; margin: 3rem auto; padding: 0 24px;"></article>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- BONG BÓNG CHAT AI -->
  <button id="ai-chat-toggle" class="ai-chat-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>
  <div id="ai-chat-window" class="ai-chat-window">
    <div class="ai-chat-header">
      <div class="ai-chat-title"><span class="status-dot"></span> Nam Gaming AI</div>
      <button id="ai-chat-close" class="ai-chat-close">&times;</button>
    </div>
    <div id="ai-chat-messages" class="ai-chat-messages">
      <div class="ai-message ai">Chào bạn! Bạn cần tìm hiểu thêm về giải đấu này không? 😎</div>
    </div>
    <div class="ai-chat-input-wrap">
      <input type="text" id="ai-chat-input" placeholder="Hỏi AI..." autocomplete="off">
      <button id="ai-chat-send">Gửi</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    // XỬ LÝ ĐỔI GIAO DIỆN
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    if (themeToggleBtn) themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });
    }
  </script>
</body>
</html>
