<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giải Đấu - Nam Gaming</title>
  <meta name="description" content="Tổng hợp các giải đấu game hấp dẫn tại Nam Gaming." />
  
  <link rel="icon" type="image/png" href="https://i.postimg.cc/Dw7jST9s/2aa9b0ff-4e2b-488c-bb0e-e2fb800cecc8.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="tournaments">
  
  <!-- NÚT CÔNG TẮC SÁNG/TỐI -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Đổi giao diện">🌙</button>

  <!-- HEADER (main.js render) -->
  <header class="site-header" id="site-header"></header>

  <!-- NỘI DUNG CHÍNH -->
  <main>
    <div class="container" style="margin-top: 3rem; margin-bottom: 5rem;">
      <h1 style="font-family: 'Orbitron', sans-serif; color: var(--primary); text-align: center; margin-bottom: 1rem; text-shadow: var(--glow); font-size: clamp(2rem, 5vw, 3rem);">
        🏆 ĐẤU TRƯỜNG NAM GAMING
      </h1>
      <p style="text-align: center; color: var(--text-dim); margin-bottom: 3rem; font-size: 1.1rem;">
        Nơi anh em gamer thể hiện bản lĩnh và rinh về những phần thưởng hấp dẫn!
      </p>
      
      <!-- NƠI HIỂN THỊ DANH SÁCH GIẢI ĐẤU (main.js sẽ đổ dữ liệu vào đây) -->
      <div class="posts-grid" id="tournaments-grid">
        <p style="text-align: center; grid-column: 1/-1; color: var(--text-dim); font-style: italic;">
          [ Đang tải danh sách giải đấu... ]
        </p>
      </div>
    </div>
  </main>

  <!-- FOOTER (main.js render) -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- ======================================================== -->
  <!-- BONG BÓNG CHAT AI (GROQ)                                 -->
  <!-- ======================================================== -->
  <button id="ai-chat-toggle" class="ai-chat-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>

  <div id="ai-chat-window" class="ai-chat-window">
    <div class="ai-chat-header">
      <div class="ai-chat-title"><span class="status-dot"></span> Nam Gaming AI</div>
      <button id="ai-chat-close" class="ai-chat-close">&times;</button>
    </div>
    <div id="ai-chat-messages" class="ai-chat-messages">
      <div class="ai-message ai">Chào bạn! Bạn có thắc mắc gì về các giải đấu trên web không? 😎</div>
    </div>
    <div class="ai-chat-input-wrap">
      <input type="text" id="ai-chat-input" placeholder="Hỏi AI..." autocomplete="off">
      <button id="ai-chat-send">Gửi</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>

  <!-- SCRIPT XỬ LÝ THEME (Đồng bộ cho trang tĩnh) -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'dark';
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    if (themeToggleBtn) themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        let theme = document.documentElement.getAttribute('data-theme');
        let newTheme = theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });
    }
  </script>
</body>
</html>
